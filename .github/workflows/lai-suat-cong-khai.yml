name: Lãi suất hằng ngày (tự chạy mỗi sáng, tự vào Google Docs)
# 2 bài lãi suất Techcombank. Mỗi sáng ~6h45 giờ VN chạy cong-cu/cap-nhat-lai-suat (nguồn VnExpress + Topi), rồi:
#   1) đăng lên nhánh tu-dong-ket-qua → app chính thấy bản mới (Chép / Tải Word)
#   2) TỰ CHÉP vào 2 file Google Docs cố định (Apps Script DongBoDocs.gs) → không phải dán tay
#   3) đăng lên trang công khai lai-suat/ (nhánh gh-pages, thư mục lai-suat/du-lieu/)
# Bấm tay: Actions → workflow này → Run workflow.
on:
  schedule:
    - cron: '43 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: lai-suat-cong-khai, cancel-in-progress: false }
jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cài trình duyệt
        run: |
          npm i -g playwright@1.48.2
          npx -y playwright@1.48.2 install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> $GITHUB_ENV
      - name: Chạy 2 bài lãi suất
        run: |
          mkdir -p ket-qua
          for m in lai-suat-1 lai-suat-2; do
            for lan in 1 2; do                      # nguồn lỗi thì nghỉ 1 phút chạy lại 1 lần
              rm -rf ket-qua/$m
              timeout 600 bash cong-cu/tu-dong/chay.sh $m ket-qua > ket-qua/$m.log 2>&1 || echo "LỖI $m" >> ket-qua/$m.log
              grep -q '^XONG' ket-qua/$m.log && break
              sleep 60
            done
            echo "::group::$m"; cat ket-qua/$m.log; echo "::endgroup::"
          done
          git config --global user.name "Cập nhật tự động"
          git config --global user.email "actions@users.noreply.github.com"
      - name: Đăng lên nhánh tu-dong-ket-qua (app chính)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          SHA=$(bash cong-cu/tu-dong/dang_ket_qua.sh ket-qua "Lãi suất $(TZ=Asia/Ho_Chi_Minh date '+%H:%M %d/%m/%Y')") || exit 1
          echo "SHA=$SHA" >> $GITHUB_ENV
      - name: Tự chép bản mới vào file Google Docs
        run: |
          BAI=""
          for m in lai-suat-1 lai-suat-2; do grep -q '^XONG' ket-qua/$m.log && BAI="$BAI $m"; done
          [ -n "$BAI" ] || { echo "::warning::Cả 2 bài lãi suất đều lỗi – không chép vào Docs"; exit 0; }
          bash cong-cu/tu-dong/dong_bo_docs.sh "$SHA" $BAI
      - name: Đăng lên trang công khai lai-suat/
        continue-on-error: true                       # trang phụ; lỗi ở đây không ảnh hưởng Docs
        run: |
          for lan in 1 2 3; do
            rm -rf trang
            git clone -q --depth 1 -b gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" trang \
              || { echo "::warning::Chưa có nhánh gh-pages – đăng app trước: bash cong-cu/dang-app/dang.sh"; exit 0; }
            mkdir -p trang/lai-suat/du-lieu
            python3 -I cong-cu/tu-dong/tong_hop.py ket-qua trang/lai-suat/du-lieu
            git -C trang add -A
            git -C trang diff --cached --quiet && exit 0
            git -C trang commit -qm "Lãi suất $(TZ=Asia/Ho_Chi_Minh date '+%H:%M %d/%m/%Y')"
            git -C trang push -q origin gh-pages && exit 0
            sleep 10                                    # có người vừa đẩy gh-pages → lấy bản mới, ghi lại
          done
          exit 1
